name: alex_transportation
description: "Transit — Employee Transport Services"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

  # Immutable models & serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Dependency injection
  get_it: ^9.2.1

  # Routing
  go_router: ^18.0.1

  # Networking
  dio: ^5.9.2

  # Firebase
  firebase_core: ^4.14.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.5.2
  firebase_messaging: ^16.7.0

  # Local storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.2.0

  # Typography
  google_fonts: ^8.2.1

  # Icons & Vector Graphics
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  lottie: ^3.5.1

  # Loading HUD
  modal_progress_hud_nsn: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  build_runner: ^2.4.13

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

  # Lints
  flutter_lints: ^6.0.0

  # App launcher icons
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1B4332"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
